<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar Cliente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Editar Cliente</h1>
    <form method="POST">
      <label for="nome_completo">Nome Completo</label>
      <input type="text" id="nome_completo" name="nome_completo" value="{{ cliente[1] }}" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" value="{{ cliente[2] }}" maxlength="11" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" value="{{ cliente[3] }}" required>

      <label for="telefone">Telefone</label>
      <input type="text" id="telefone" name="telefone" value="{{ cliente[4] }}" required>

      <label for="data_nascimento">Data de Nascimento</label>
      <input type="date" id="data_nascimento" name="data_nascimento" value="{{ cliente[5] }}" required>

      <button type="submit">Salvar Alterações</button>
    </form>
    <p class="center-link"><a href="/lista">Cancelar</a></p>
  </div>
</body>
</html>
